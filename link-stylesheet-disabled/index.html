  <script type="module">
    const lazyStylesheets = Array.from(document.querySelectorAll('link[rel="stylesheet"][disabled]'));
    const target = document.querySelector('.gallery-container');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          lazyStylesheets.forEach(link => link.disabled = false);
          observer.disconnect();
        }
      });
    });

    observer.observe(target);
  </script>
